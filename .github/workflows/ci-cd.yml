name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend tests (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-kpis-management

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw test -B -Dgroups="!local"

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend-kpis-management/target/surefire-reports/

  # ── Frontend tests ────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend tests (Node / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-kpis-management

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-kpis-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # ── Deploy to Dokploy ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production (Dokploy)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger backend deploy
        run: |
          curl -f -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"${{ secrets.DOKPLOY_BACKEND_APP_ID }}"}'

      - name: Trigger frontend deploy
        run: |
          curl -f -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"${{ secrets.DOKPLOY_FRONTEND_APP_ID }}"}'
