# H2 in-memory DB for tests — no real MySQL required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,MONTH,VALUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT mínimo para contexto de seguridad
app.jwt.secret=dGVzdFNlY3JldEtleUZvclRlc3RpbmdPbmx5MTIzNDU2Nzg=
app.jwt.expiration=3600000

# Admin seed
app.admin.email=admin@test.com
app.admin.password=admin123

# App version
app.version=test

# ML service (sin llamadas reales en tests)
ml.service.url=http://localhost:9999
